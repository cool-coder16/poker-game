<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · Poker Night</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">♠ <span>Poker</span> Night</a></h1>
    <div class="sub">Settings</div>
    <nav class="topnav"><a class="tut-link" href="index.html">☰ Menu</a></nav>
    <div class="auth-bar" id="authBar"></div>
  </header>

  <main class="page narrow">
    <section class="panel settings-form">
      <h2>Game settings</h2>
      <label>Blinds
        <select id="optSb">
          <option value="5">5 / 10</option>
          <option value="10">10 / 20</option>
          <option value="25">25 / 50</option>
          <option value="50">50 / 100</option>
        </select>
      </label>
      <label>Starting chips
        <select id="optStack">
          <option value="500">500</option>
          <option value="1000">1,000</option>
          <option value="2000">2,000</option>
          <option value="5000">5,000</option>
        </select>
      </label>
      <label>Bot speed
        <select id="optSpeed">
          <option value="0.3">Fast</option>
          <option value="1">Normal</option>
          <option value="1.8">Slow</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="optAuto"> Auto-deal next hand</label>
      <label class="check"><input type="checkbox" id="optRebuy"> Bots rebuy when busted</label>
      <p class="hint">
        Saved in this browser the moment you change it, and used the next time you open Singleplayer.
        Signed-in players always start each weekly season with 1,000 chips, so "Starting chips" only
        affects guests and new bots.
      </p>
      <div class="settings-actions">
        <span class="saved" id="savedNote"></span>
        <button class="btn small" id="btnReset" type="button">Reset to defaults</button>
      </div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="season.js"></script>
  <script src="account.js"></script>
  <script src="settings-page.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
