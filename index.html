<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Night</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">♠ <span>Poker</span> Night</a></h1>
    <div class="sub">No-limit Texas Hold'em</div>
    <div class="auth-bar topnav" id="authBar"></div>
  </header>

  <main class="page menu">
    <div class="hero">
      <div class="hero-suits">♠ <span>♥</span> <span>♦</span> ♣</div>
      <h2>Main menu</h2>
      <p class="season-line" id="seasonLine"></p>
    </div>

    <nav class="menu-grid">
      <a class="menu-card" href="play.html">
        <span class="mc-icon">🃏</span><b>Singleplayer</b><small>Play against bots you choose</small>
      </a>
      <a class="menu-card" href="play.html?tutorial">
        <span class="mc-icon">🎓</span><b>Tutorial</b><small>Learn the game in 7 quick steps</small>
      </a>
      <!-- Multiplayer isn't built yet: a disabled button, so clicking does nothing -->
      <button class="menu-card" type="button" disabled>
        <span class="mc-icon">🌐</span><b>Multiplayer</b><small>Coming soon</small>
      </button>
      <a class="menu-card" href="leaderboard.html">
        <span class="mc-icon">🏆</span><b>Leaderboard</b><small>Weekly season and all-time rating</small>
      </a>
      <a class="menu-card" href="account.html">
        <span class="mc-icon">👤</span><b>Account</b><small>Your stats, rating and season</small>
      </a>
      <a class="menu-card" href="settings.html">
        <span class="mc-icon">⚙️</span><b>Settings</b><small>Blinds, speed and more</small>
      </a>
    </nav>
  </main>

  <script src="common.js"></script>
  <script src="season.js"></script>
  <script src="account.js"></script>
  <script src="menu.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
